name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # No "models" extra: torch-dependent tests skip, as they do on laptops.
      - run: pip install -e ".[dev,analysis]"
      - run: python -m pytest tests/ -q
